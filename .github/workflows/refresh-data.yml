name: Refresh cruise schedule

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run scraper
        run: node scraper/scrape.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet public/schedule.json \
            && echo "changed=false" >> $GITHUB_OUTPUT \
            || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated schedule
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/schedule.json
          git commit -m "chore: refresh cruise schedule $(date -u +%Y-%m-%d)"
          git push

      - name: Build site
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to VPS
        if: steps.diff.outputs.changed == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/home/$VPS_USER/docker/alesundtoday/dist/"
