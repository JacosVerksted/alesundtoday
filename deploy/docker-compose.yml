# Reference for how the site is served: nginx serving the built files read-only.
# TLS, the domain and routing are handled by the reverse proxy in front of it and are
# not configured here — there are deliberately no proxy labels in this file.
#
# `dist/` is filled by deploy/vps-rebuild.sh; `nginx.conf` is deploy/nginx.conf.
# Set the network below to the Docker network your reverse proxy reaches containers on.
services:
  alesundtoday:
    image: nginx:alpine
    container_name: alesundtoday
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
