limit_req_zone  $binary_remote_addr zone=alesund_per_ip:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=alesund_conn_per_ip:10m;

map $http_user_agent $blocked_agent {
    default 0;
    ~*(?:wordpress|wp-|wp_|xmlrpc|acunetix|nikto|sqlmap|masscan|nmap|zgrab|dirbuster|gobuster|python-requests|libwww-perl) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    gzip on;
    gzip_types text/html text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    limit_conn alesund_conn_per_ip 16;
    limit_req  zone=alesund_per_ip burst=300 nodelay;

    if ($blocked_agent) { return 404; }

    # Only static reads expected
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        application/manifest+json   webmanifest;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        image/x-icon                ico;
    }

    # Drop common scanner / CMS probes early
    location ~* ^/(?:wp-admin|wp-content|wp-includes|wordpress|wp|blog|cms|xmlrpc\.php|wp-login\.php|\.env|\.git|vendor|phpmyadmin|pma|adminer|cgi-bin)(?:/|$) {
        return 404;
    }
    location ~* \.(?:php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|py|rb|env|ini|bak|old|sql|tar|tgz|gz|7z|rar)$ {
        return 404;
    }
    location ~ /\. { deny all; }

    # Health check — used by Uptime Kuma / Pangolin autokuma
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Allow search engines — this is a public app
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    # Service worker — browsers check this on every load; must never be stale
    location = /sw.js {
        add_header Cache-Control      "no-store"          always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy    "no-referrer"       always;
        add_header X-Frame-Options    "SAMEORIGIN"        always;
        try_files $uri =404;
    }

    # Content-hashed Astro bundles — filename changes on every build, safe to keep forever
    location /_astro/ {
        add_header Cache-Control      "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy    "no-referrer"       always;
        add_header X-Frame-Options    "SAMEORIGIN"        always;
        try_files $uri =404;
    }

    # schedule.json — revalidate hourly, serve stale for up to a day if origin is down
    location = /schedule.json {
        add_header Cache-Control      "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy    "no-referrer"       always;
        add_header X-Frame-Options    "SAMEORIGIN"        always;
        try_files $uri =404;
    }

    # Icons and web manifest — a week is plenty
    location ~* \.(png|ico|svg|webmanifest)$ {
        add_header Cache-Control      "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy    "no-referrer"       always;
        add_header X-Frame-Options    "SAMEORIGIN"        always;
        try_files $uri =404;
    }

    # HTML (index.html) — revalidate daily, serve stale for a week offline
    location / {
        add_header Cache-Control      "public, max-age=86400, stale-while-revalidate=604800" always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy    "no-referrer"       always;
        add_header X-Frame-Options    "SAMEORIGIN"        always;
        try_files $uri $uri/index.html =404;
    }
}
