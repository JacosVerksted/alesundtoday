# Rate limits are per visitor. nginx sits behind a reverse proxy, so the real client
# address is restored from X-Forwarded-For below; without that, every request would
# look like it came from the proxy and the whole site would share one limit.
limit_req_zone  $binary_remote_addr zone=alesund_per_ip:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=alesund_conn_per_ip:10m;
# Scanners enumerating admin/CMS paths get a much tighter allowance than real visitors.
limit_req_zone  $binary_remote_addr zone=alesund_probe:10m  rate=1r/s;

map $http_user_agent $blocked_agent {
    default 0;
    ~*(?:wordpress|wp-|wp_|xmlrpc|acunetix|nikto|sqlmap|masscan|nmap|zgrab|dirbuster|gobuster|python-requests|libwww-perl) 1;
}

# Cache policy by path, applied once in the server block below.
# Hashed assets can live forever; everything else is revalidated on every visit
# (nginx sends ETag/Last-Modified, so an unchanged file costs a tiny 304 reply).
map $uri $cache_control {
    default                           "no-cache";
    ~^/_astro/                        "public, max-age=31536000, immutable";
    /sw.js                            "no-store";
    ~*\.(?:png|ico|svg|webmanifest)$  "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # Trust the reverse proxy (any container on Docker's private ranges) to say who the
    # visitor is. Only containers on this network can reach nginx directly.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # No access log: visitor IP addresses are personal data and nothing here needs them.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/xml text/javascript application/javascript
               application/json application/manifest+json image/svg+xml image/x-icon;
    gzip_min_length 1024;

    limit_conn alesund_conn_per_ip 16;
    limit_conn_status 429;
    limit_req  zone=alesund_per_ip burst=40 nodelay;
    limit_req_status 429;

    if ($blocked_agent) { return 404; }

    # Only static reads expected
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Caching: no `always`, so only successful responses get it — a 404 for a hashed
    # asset must never be cached as "immutable".
    add_header Cache-Control $cache_control;

    # Security headers (on every response, including errors).
    # The page has no inline scripts or styles, so the policy can be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        application/json            json;
        application/manifest+json   webmanifest;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        image/x-icon                ico;
        application/xml             xml;
    }

    # Scanner, CMS and admin probes (WordPress, .env, .git, phpinfo, admin panels, ...).
    # This is a static site with none of those, so they all get the same plain 404 — never
    # a 403, which would suggest something exists — and are throttled hard (429 once the
    # allowance is used up). Not `return 404`: nginx runs `return` before the rate limiter,
    # so the limit would never apply. `try_files` of a file that does not exist does.
    # Whole path segments only; add a segment here if a real page ever needs one of these names.
    location ~* ^/(?:wp-(?:admin|content|includes|json|login\.php|cron\.php|config\.php)|wordpress|wp|blog|cms|site|news|press|xmlrpc\.php|admin|administrator|login|signin|manager|console|dashboard|phpmyadmin|pma|adminer|cgi-bin|vendor|_ignition|actuator|server-status|server-info|solr|jenkins|boaform|hnap1|owa|ecp|backup|backups|dump|storage)(?:/|$) {
        limit_req zone=alesund_probe burst=5 nodelay;
        try_files /.nginx-probe-404 =404;
    }
    # Dotfiles anywhere (.env*, .git/*, .svn, .htaccess, .DS_Store, ...) and script/backup/archive files
    location ~* (?:/\.|\.(?:php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|py|rb|env|ini|bak|old|sql|tar|tgz|gz|7z|rar|zip|swp)$) {
        limit_req zone=alesund_probe burst=5 nodelay;
        try_files /.nginx-probe-404 =404;
    }

    # Health check — for uptime monitoring
    location = /health {
        default_type text/plain;
        return 200 "ok";
    }

    # Allow search engines — this is a public app
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nSitemap: https://alesundtoday.jacosverksted.no/sitemap.xml\n";
    }

    # Everything else is static files (the headers above apply to all of them)
    location / {
        if ($arg_rest_route) { return 404; }
        try_files $uri $uri/index.html =404;
    }
}
