server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed Astro assets — cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # schedule.json — revalidate every hour
    location = /schedule.json {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Service worker — must not be cached so updates propagate
    location = /sw.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Everything else (HTML, manifest, icons) — revalidate daily
    location / {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri $uri/ /index.html;
    }
}
